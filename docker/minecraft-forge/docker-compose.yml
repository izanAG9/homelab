services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-forge

    tty: true
    stdin_open: true

    ports:
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "8G"

    volumes:
      - ./data:/data

    restart: unless-stopped
